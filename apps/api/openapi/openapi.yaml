openapi: 3.1.0
info:
  title: Midas API
  version: 1.0.0
  summary: Personal finance tracking API.
  description: |
    OpenAPI 3.1 description of the Midas API contract v1 (`docs/api-contract.md`).

    Conventions:
    - Money is always an integer in minor units (for example cents) paired with an ISO 4217 currency code. Never a float.
    - Bodies are `application/json` with camelCase fields. Request schemas are strict: unknown fields are rejected with `400 VALIDATION_FAILED`.
    - `PATCH` is partial. Omitted fields are unchanged and `null` clears a nullable field.
    - Errors are RFC 9457 Problem Details (`application/problem+json`). Every operation can also return 400 VALIDATION_FAILED, 429 RATE_LIMITED and 500 INTERNAL_ERROR; authenticated operations can also return 401 UNAUTHENTICATED.
    - A resource owned by another user is reported as 404 NOT_FOUND.

    Each operation carries `x-implementation-status` (`implemented` or `planned`) describing the state of the server code.
servers:
  - url: /
    description: Same origin as the web app.
tags:
  - name: Ops
  - name: Auth
  - name: Profile
  - name: Wallets
  - name: Categories
  - name: Transactions
  - name: Transfers
  - name: Budgets
  - name: Reports
  - name: Recurring templates
  - name: Admin users
  - name: Admin categories
  - name: Admin metrics and audit
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Ops]
      operationId: getHealth
      summary: Readiness probe
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is down (`checks.database = down`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /metrics:
    get:
      tags: [Ops]
      operationId: getMetrics
      summary: Prometheus metrics
      description: 'Requires `Authorization: Bearer <METRICS_TOKEN>`. Returns 404 when `METRICS_TOKEN` is unset.'
      x-implementation-status: implemented
      security:
        - metricsToken: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            'text/plain; version=0.0.4':
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register an account
      description: Rate limited. New users get preference `theme = system` and system categories are immediately available.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created. Sets the `midas_rt` refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: EMAIL_TAKEN (with `errors[0].field = "email"`).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: Rate limited. The same response is returned for an unknown email and a wrong password.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. Sets the `midas_rt` refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: INVALID_CREDENTIALS.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: ACCOUNT_SUSPENDED (only after the password is verified).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: Requires the `midas_rt` cookie, an `Origin` matching the app origin and `X-CSRF-Protection`.
      x-implementation-status: implemented
      security:
        - refreshCookie: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200':
          description: Session refreshed. Sets a rotated `midas_rt` cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: SESSION_INVALID (missing, expired, revoked or reused token, or suspended user). The cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: FORBIDDEN (Origin or CSRF header check failed).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Idempotent. Accepts the refresh cookie, or a bearer token.
      x-implementation-status: implemented
      security:
        - refreshCookie: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204':
          description: Session revoked and cookie cleared (also when the session is already gone).
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          $ref: '#/components/responses/Forbidden'
          description: FORBIDDEN (Origin or CSRF header check failed).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: Rate limited. The response is identical for known and unknown emails.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password/reset/verify:
    post:
      tags: [Auth]
      operationId: verifyPasswordResetToken
      summary: Check that a reset token is valid without consuming it
      description: Rate limited.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetTokenRequest' }
      responses:
        '204':
          description: The token is currently valid.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: RESET_TOKEN_INVALID (unknown, expired or already used) or VALIDATION_FAILED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      description: Rate limited. Consumes the token and revokes all sessions.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: Password updated. The user must sign in again.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: RESET_TOKEN_INVALID, or VALIDATION_FAILED (field code WEAK_PASSWORD).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the current user
      x-implementation-status: implemented
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update display name or preferences
      description: Email change is not supported in v1.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me/password:
    post:
      tags: [Profile]
      operationId: changePassword
      summary: Change the password
      description: All other sessions are revoked; the current session stays.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
          description: INVALID_CURRENT_PASSWORD, or VALIDATION_FAILED (field codes WEAK_PASSWORD, SAME_AS_CURRENT).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/wallets:
    get:
      tags: [Wallets]
      operationId: listWallets
      summary: List wallets
      x-implementation-status: implemented
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Wallets sorted by name (at most 100).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Wallets]
      operationId: createWallet
      summary: Create a wallet
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWalletRequest' }
      responses:
        '201':
          description: The created wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: WALLET_NAME_TAKEN or LIMIT_REACHED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/wallets/{walletId}:
    parameters:
      - { $ref: '#/components/parameters/WalletId' }
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Get a wallet
      x-implementation-status: implemented
      responses:
        '200':
          description: The wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Wallets]
      operationId: updateWallet
      summary: Update a wallet
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWalletRequest' }
      responses:
        '200':
          description: The updated wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: WALLET_NAME_TAKEN, WALLET_ARCHIVED or WALLET_CURRENCY_LOCKED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Wallets]
      operationId: deleteWallet
      summary: Delete a wallet
      x-implementation-status: implemented
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: WALLET_IN_USE (has transactions or recurring templates; archive it instead).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/wallets/{walletId}/archive:
    parameters:
      - { $ref: '#/components/parameters/WalletId' }
    post:
      tags: [Wallets]
      operationId: archiveWallet
      summary: Archive a wallet
      description: Idempotent. Active recurring templates on this wallet are paused.
      x-implementation-status: implemented
      responses:
        '200':
          description: The archived wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/wallets/{walletId}/unarchive:
    parameters:
      - { $ref: '#/components/parameters/WalletId' }
    post:
      tags: [Wallets]
      operationId: unarchiveWallet
      summary: Unarchive a wallet
      description: Idempotent. Recurring templates stay paused.
      x-implementation-status: implemented
      responses:
        '200':
          description: The active wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: WALLET_NAME_TAKEN (an active wallet now uses the name).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List system and own categories
      x-implementation-status: implemented
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
        - name: includeRetired
          in: query
          description: When true, retired system categories are included.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Categories sorted by type, then name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a user category
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: The created category (`system = false`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_NAME_TAKEN or LIMIT_REACHED (200).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/categories/{categoryId}:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a user category
      description: '`type` cannot be changed.'
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          description: SYSTEM_CATEGORY_READ_ONLY.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_NAME_TAKEN.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a user category, optionally reassigning its usage
      x-implementation-status: implemented
      parameters:
        - name: reassignTo
          in: query
          description: Required when the category is used by transactions or recurring templates. Must be an accessible, non-retired category of the same type, other than the one being deleted.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deletion summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteCategoryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          description: SYSTEM_CATEGORY_READ_ONLY.
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_IN_USE (in use and no `reassignTo`).
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: REASSIGN_TARGET_INVALID.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions (cursor pagination)
      description: Each transfer leg appears as its own row in its wallet. A cursor is bound to its sort and filters.
      x-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/TxFrom' }
        - { $ref: '#/components/parameters/TxTo' }
        - { $ref: '#/components/parameters/TxWalletId' }
        - { $ref: '#/components/parameters/TxCategoryId' }
        - { $ref: '#/components/parameters/TxType' }
        - { $ref: '#/components/parameters/TxSearch' }
        - { $ref: '#/components/parameters/TxMinAmount' }
        - { $ref: '#/components/parameters/TxMaxAmount' }
        - { $ref: '#/components/parameters/TxSort' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: INVALID_CURSOR, or VALIDATION_FAILED (range inverted).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create an income or expense transaction
      description: Use `/api/v1/transfers` for transfers.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
      responses:
        '201':
          description: The created transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: WALLET_ARCHIVED.
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: INVALID_REFERENCE (wallet or category not found or not accessible), CATEGORY_TYPE_MISMATCH or CATEGORY_RETIRED.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transactions/export:
    get:
      tags: [Transactions]
      operationId: exportTransactions
      summary: Export transactions as CSV
      description: |
        Rate limited (10/min). Same filters as the list endpoint except `limit` and `cursor`. Streamed UTF-8 CSV with a BOM and the header row
        `date,type,direction,wallet,currency,amount,category,note,counterpart_wallet,transaction_id,transfer_id,recurring_template_id`.
        `amount` is a signed decimal in major units. Text cells beginning with `=`, `+`, `-`, `@`, tab or carriage return are prefixed with a single quote.
      x-implementation-status: implemented
      parameters:
        - { $ref: '#/components/parameters/TxFrom' }
        - { $ref: '#/components/parameters/TxTo' }
        - { $ref: '#/components/parameters/TxWalletId' }
        - { $ref: '#/components/parameters/TxCategoryId' }
        - { $ref: '#/components/parameters/TxType' }
        - { $ref: '#/components/parameters/TxSearch' }
        - { $ref: '#/components/parameters/TxMinAmount' }
        - { $ref: '#/components/parameters/TxMaxAmount' }
        - { $ref: '#/components/parameters/TxSort' }
      responses:
        '200':
          description: CSV file.
          headers:
            Content-Disposition:
              description: 'attachment; filename="midas-transactions-YYYYMMDD.csv"'
              schema: { type: string }
          content:
            'text/csv; charset=utf-8':
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transactions/{transactionId}:
    parameters:
      - { $ref: '#/components/parameters/TransactionId' }
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction
      x-implementation-status: implemented
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
