          description: CANNOT_MODIFY_SELF or LAST_ADMIN.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/users/{userId}/reactivate:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [Admin users]
      operationId: adminReactivateUser
      summary: Reactivate a user
      description: Audited (`admin.user_reactivated`). Idempotent.
      x-implementation-status: implemented
      responses:
        '200':
          description: The reactivated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CANNOT_MODIFY_SELF.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/users/{userId}/role:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Admin users]
      operationId: adminChangeUserRole
      summary: Change a user's role
      description: Audited (`admin.user_role_changed`, metadata `{ from, to }`). Takes effect on the target's next request.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRoleRequest' }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CANNOT_MODIFY_SELF or LAST_ADMIN.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/categories:
    get:
      tags: [Admin categories]
      operationId: adminListCategories
      summary: List system categories
      x-implementation-status: implemented
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
        - name: includeRetired
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: System categories only.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Admin categories]
      operationId: adminCreateCategory
      summary: Create a system category
      description: Audited (`admin.category_created`).
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: The created category (`system = true`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_NAME_TAKEN (among system categories of the same type).
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/categories/{categoryId}:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    patch:
      tags: [Admin categories]
      operationId: adminUpdateCategory
      summary: Update a system category
      description: Audited (`admin.category_updated`, metadata lists the changed field names).
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND (also for user-owned categories).
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_NAME_TAKEN.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/categories/{categoryId}/retire:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    post:
      tags: [Admin categories]
      operationId: adminRetireCategory
      summary: Retire a system category
      description: It stays on existing transactions, budgets and templates and cannot be selected for new ones. Audited. Idempotent.
      x-implementation-status: implemented
      responses:
        '200':
          description: The retired category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/categories/{categoryId}/restore:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    post:
      tags: [Admin categories]
      operationId: adminRestoreCategory
      summary: Restore a retired system category
      description: Audited. Idempotent.
      x-implementation-status: implemented
      responses:
        '200':
          description: The restored category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_NAME_TAKEN.
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/metrics:
    get:
      tags: [Admin metrics and audit]
      operationId: adminGetMetrics
      summary: Platform metrics
      description: Cached for up to 5 minutes; see `generatedAt`.
      x-implementation-status: implemented
      responses:
        '200':
          description: Platform metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin metrics and audit]
      operationId: adminListAuditLogs
      summary: List audit log entries (newest first, cursor pagination)
      description: There are no endpoints for creating, updating or deleting audit entries.
      x-implementation-status: implemented
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: actorEmail
          in: query
          description: Exact match, case-insensitive.
          schema: { type: string }
        - name: action
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/AuditAction' }
        - name: targetType
          in: query
          schema: { $ref: '#/components/schemas/AuditTargetType' }
        - name: targetId
          in: query
          description: Requires `targetType` (400 otherwise), so the target index is always used.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: UTC day, inclusive.
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: to
          in: query
          description: UTC day, inclusive.
          schema: { $ref: '#/components/schemas/LocalDate' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
          description: INVALID_CURSOR, or VALIDATION_FAILED.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'User: valid access token, user status `active`. Admin operations additionally require the current role `admin` (read from the database on every request).'
    refreshCookie:
      type: apiKey
      in: cookie
      name: midas_rt
      description: Refresh token cookie. Also requires an `Origin` matching the app origin and the header `X-CSRF-Protection` set to 1.
    metricsToken:
      type: http
      scheme: bearer
      description: The static `METRICS_TOKEN`.

  headers:
    SetRefreshCookie:
      description: '`midas_rt=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000`. Cleared on logout and on a failed refresh.'
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }

  parameters:
    CsrfHeader:
      name: X-CSRF-Protection
      in: header
      required: true
      schema: { type: string, const: '1' }
    WalletId:
      name: walletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size for cursor pagination.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response, bound to its sort and filters. An invalid or mismatched cursor returns 400 INVALID_CURSOR.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    BudgetDate:
      name: date
      in: query
      description: Status is computed for the period containing this date. Defaults to today in the user's timezone.
      schema: { $ref: '#/components/schemas/LocalDate' }
    TxFrom:
      name: from
      in: query
      schema: { $ref: '#/components/schemas/LocalDate' }
    TxTo:
      name: to
      in: query
      description: Must be on or after `from`.
      schema: { $ref: '#/components/schemas/LocalDate' }
    TxWalletId:
      name: walletId
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, format: uuid }
    TxCategoryId:
      name: categoryId
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string, format: uuid }
    TxType:
      name: type
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/TransactionType' }
    TxSearch:
      name: q
      in: query
      description: Case-insensitive substring of the note.
      schema: { type: string, minLength: 1, maxLength: 100 }
    TxMinAmount:
      name: minAmountMinor
      in: query
      schema: { $ref: '#/components/schemas/AmountMinor' }
    TxMaxAmount:
      name: maxAmountMinor
      in: query
      description: Must be at least `minAmountMinor`.
      schema: { $ref: '#/components/schemas/AmountMinor' }
    TxSort:
      name: sort
      in: query
      description: Ties are broken by createdAt, then id.
      schema: { $ref: '#/components/schemas/TransactionSort' }

  responses:
    BadRequest:
      description: 400. VALIDATION_FAILED (also malformed JSON) and other client errors such as INVALID_CURSOR.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 401. UNAUTHENTICATED (missing, invalid or expired access token).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 403. Authenticated but not permitted (FORBIDDEN, for example a non-admin on an admin route).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 404 NOT_FOUND. The resource does not exist or is owned by another user.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 409. State conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: 422. Semantic business-rule violation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 429 RATE_LIMITED.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: 500 INTERNAL_ERROR. No internals are leaked.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---- Scalars -------------------------------------------------------
    Uuid: { type: string, format: uuid }
    LocalDate:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD`, valid range 1900-01-01 to 2100-12-31.
      examples: ['2026-10-16']
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC.
      examples: ['2026-10-16T08:30:00.000Z']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: 3 uppercase letters from `SUPPORTED_CURRENCIES` (shared package).
      examples: [USD]
    Locale:
      type: string
      description: BCP 47 tag from `SUPPORTED_LOCALES` (shared package).
      examples: [en-US]
    TimeZone:
      type: string
      description: IANA zone name.
      examples: [Europe/Berlin]
    AmountMinor:
      type: integer
      minimum: 1
      maximum: 100000000000000
      description: Positive amount in integer minor units of the associated currency.
    SignedAmountMinor:
      type: integer
      minimum: -100000000000000
      maximum: 100000000000000
      description: Signed amount in integer minor units of the associated currency.
    IconKey:
      type: string
      description: A key from `CATEGORY_ICONS` (shared package).
    ColorToken:
      type: string
      description: A palette key from `CATEGORY_COLORS` (shared package).
    Email:
      type: string
      format: email
      maxLength: 254
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      description: Must reach zxcvbn score 3 or higher.
    Note:
      type: [string, 'null']
      maxLength: 500

    # ---- Enums ---------------------------------------------------------
    Role: { type: string, enum: [user, admin] }
    UserStatus: { type: string, enum: [active, suspended] }
    Theme: { type: string, enum: [light, dark, system] }
    WalletType: { type: string, enum: [cash, bank, card, savings] }
    CategoryType: { type: string, enum: [income, expense] }
    TransactionType: { type: string, enum: [income, expense, transfer] }
    TransferDirection: { type: string, enum: [out, in] }
    TransactionSort:
      type: string
      enum: [date_desc, date_asc, amount_desc, amount_asc]
      default: date_desc
    BudgetScope: { type: string, enum: [overall, category] }
    BudgetPeriod:
      type: string
      enum: [weekly, monthly, yearly]
      default: monthly
    BudgetState: { type: string, enum: [ok, warning, exceeded] }
    RecurringType: { type: string, enum: [income, expense] }
    RecurringFrequency: { type: string, enum: [daily, weekly, monthly, yearly] }
    RecurringStatus: { type: string, enum: [active, paused, ended] }
    RecurringRunStatus: { type: string, enum: [succeeded, failed, skipped] }
    TrendGroupBy: { type: string, enum: [day, week, month] }
    AdminUserSort:
      type: string
      enum: [createdAt_desc, createdAt_asc, email_asc, lastLoginAt_desc]
      default: createdAt_desc
    AuditTargetType: { type: string, enum: [user, session, category, system] }
    AuditAction:
      type: string
      enum:
        - auth.registered
        - auth.login_succeeded
        - auth.login_failed
        - auth.login_blocked_suspended
        - auth.logout
        - auth.session_reuse_detected
        - auth.password_reset_requested
        - auth.password_reset_completed
        - user.password_changed
        - admin.user_suspended
        - admin.user_reactivated
        - admin.user_role_changed
        - admin.category_created
        - admin.category_updated
        - admin.category_retired
        - admin.category_restored
        - system.admin_bootstrapped

    # ---- Errors --------------------------------------------------------
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 'Dot path, for example `preferences.currency`.' }
        code:
          {
            type: string,
            description: 'For example REQUIRED, TOO_SHORT, WEAK_PASSWORD, INVALID_FORMAT, EMAIL_TAKEN.',
          }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          {
            type: string,
            format: uri-reference,
            examples: ['https://midas.app/problems/validation-failed'],
          }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: Request path. }
        code:
          type: string
          description: Error catalogue code, for example VALIDATION_FAILED, NOT_FOUND, WALLET_NAME_TAKEN, RATE_LIMITED, INTERNAL_ERROR.
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    # ---- Core models ---------------------------------------------------
    Preferences:
      type: object
      required: [currency, locale, timezone, theme]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { $ref: '#/components/schemas/TimeZone' }
        theme: { $ref: '#/components/schemas/Theme' }
    User:
      type: object
      required: [id, email, displayName, role, status, preferences, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        preferences: { $ref: '#/components/schemas/Preferences' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AuthSession:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken: { type: string, description: JWT access token. }
        accessTokenExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        user: { $ref: '#/components/schemas/User' }
    WalletRef:
      type: object
      required: [id, name, currency, archived]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        archived: { type: boolean }
    Wallet:
      type: object
      required:
        [
          id,
          name,
          type,
          currency,
          openingBalanceMinor,
          balanceMinor,
          archived,
          archivedAt,
          hasTransactions,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/WalletType' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        openingBalanceMinor: { $ref: '#/components/schemas/SignedAmountMinor' }
        balanceMinor:
          allOf:
            - { $ref: '#/components/schemas/SignedAmountMinor' }
          description: Opening balance + income - expense - transfers out + transfers in.
        archived: { type: boolean }
        archivedAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        hasTransactions: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CategoryRef:
      type: object
      required: [id, name, type, icon, color, system, retired]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        type: { $ref: '#/components/schemas/CategoryType' }
        icon: { $ref: '#/components/schemas/IconKey' }
        color: { $ref: '#/components/schemas/ColorToken' }
        system: { type: boolean }
        retired: { type: boolean }
    Category:
      type: object
      required: [id, name, type, icon, color, system, retired, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/CategoryType' }
        icon: { $ref: '#/components/schemas/IconKey' }
        color: { $ref: '#/components/schemas/ColorToken' }
        system: { type: boolean }
        retired: { type: boolean, description: Always false for user categories. }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    TransferLeg:
      type: object
      required:
        [transferId, direction, counterpartTransactionId, counterpartWallet, counterpartAmountMinor]
      properties:
        transferId: { $ref: '#/components/schemas/Uuid' }
        direction: { $ref: '#/components/schemas/TransferDirection' }
        counterpartTransactionId: { $ref: '#/components/schemas/Uuid' }
        counterpartWallet: { $ref: '#/components/schemas/WalletRef' }
        counterpartAmountMinor: { $ref: '#/components/schemas/AmountMinor' }
    Transaction:
      type: object
      required:
        [
          id,
          type,
          wallet,
          category,
          amountMinor,
          currency,
          occurredOn,
          note,
          transfer,
          recurringTemplateId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/TransactionType' }
        wallet: { $ref: '#/components/schemas/WalletRef' }
        category:
          description: Null if and only if type is `transfer`.
          oneOf:
            - { $ref: '#/components/schemas/CategoryRef' }
            - { type: 'null' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          description: Equals the wallet currency.
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
        transfer:
          description: Non-null if and only if type is `transfer`.
          oneOf:
            - { $ref: '#/components/schemas/TransferLeg' }
            - { type: 'null' }
        recurringTemplateId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Transfer:
      type: object
      required:
        [
          id,
          fromWallet,
          toWallet,
          amountMinor,
          toAmountMinor,
          occurredOn,
          note,
          outTransactionId,
          inTransactionId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        fromWallet: { $ref: '#/components/schemas/WalletRef' }
        toWallet: { $ref: '#/components/schemas/WalletRef' }
        amountMinor:
          allOf:
            - { $ref: '#/components/schemas/AmountMinor' }
          description: Debited from fromWallet, in its currency.
        toAmountMinor:
          allOf:
            - { $ref: '#/components/schemas/AmountMinor' }
          description: Credited to toWallet, in its currency.
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
        outTransactionId: { $ref: '#/components/schemas/Uuid' }
        inTransactionId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    BudgetStatus:
      type: object
      required: [periodStart, periodEnd, spentMinor, remainingMinor, percentUsed, state]
      properties:
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        spentMinor: { type: integer, minimum: 0 }
        remainingMinor:
          allOf:
            - { $ref: '#/components/schemas/SignedAmountMinor' }
          description: Limit minus spent; negative when over.
        percentUsed:
          {
            type: number,
            description: 'spent / limit x 100, rounded to 1 decimal, may exceed 100.',
          }
        state: { $ref: '#/components/schemas/BudgetState' }
    Budget:
      type: object
      required:
        [
          id,
          scope,
          category,
          period,
          amountMinor,
          currency,
          warningThresholdPct,
          startDate,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { $ref: '#/components/schemas/BudgetScope' }
        category:
          description: Null if and only if scope is `overall`.
          oneOf:
            - { $ref: '#/components/schemas/CategoryRef' }
            - { type: 'null' }
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        amountMinor:
          allOf:
            - { $ref: '#/components/schemas/AmountMinor' }
          description: The limit.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        warningThresholdPct: { type: integer, minimum: 1, maximum: 99 }
        startDate:
          allOf:
            - { $ref: '#/components/schemas/LocalDate' }
          description: Normalized to the period start.
        status:
          description: Null if the requested period ends before startDate.
          oneOf:
            - { $ref: '#/components/schemas/BudgetStatus' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    RecurringTemplate:
      type: object
      required:
        [
          id,
          name,
          type,
          wallet,
          category,
          amountMinor,
          currency,
          note,
          frequency,
          interval,
          startDate,
          endDate,
          nextRunOn,
          status,
          lastRunAt,
          lastError,
          consecutiveFailures,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/RecurringType' }
        wallet: { $ref: '#/components/schemas/WalletRef' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          description: Wallet currency.
        note: { $ref: '#/components/schemas/Note' }
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        interval: { type: integer, minimum: 1, maximum: 99 }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        nextRunOn:
          description: Null when ended.
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        status: { $ref: '#/components/schemas/RecurringStatus' }
        lastRunAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        lastError:
          description: Error code of the last failed run.
          type: [string, 'null']
        consecutiveFailures: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    RecurringRun:
      type: object
      required:
        [
          id,
          templateId,
          occurrenceDate,
          status,
          transactionId,
          errorCode,
          attempts,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        templateId: { $ref: '#/components/schemas/Uuid' }
        occurrenceDate: { $ref: '#/components/schemas/LocalDate' }
        status: { $ref: '#/components/schemas/RecurringRunStatus' }
        transactionId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        errorCode: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdminUser:
      type: object
      required: [id, email, displayName, role, status, createdAt, lastLoginAt, suspendedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastLoginAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        suspendedAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
    AdminUserDetail:
      allOf:
        - { $ref: '#/components/schemas/AdminUser' }
        - type: object
          required: [suspendedReason, activeSessionCount]
          properties:
            suspendedReason: { type: [string, 'null'] }
            activeSessionCount: { type: integer, minimum: 0 }
    AuditLogEntry:
      type: object
      required: [id, occurredAt, actor, action, target, ip, userAgent, requestId, metadata]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        actor:
          description: Null means system or anonymous.
          oneOf:
            - type: object
              required: [id, email]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                email: { type: string }
            - { type: 'null' }
        action: { $ref: '#/components/schemas/AuditAction' }
        target:
          type: object
          required: [type, id]
          properties:
            type: { $ref: '#/components/schemas/AuditTargetType' }
            id:
              oneOf:
                - { $ref: '#/components/schemas/Uuid' }
                - { type: 'null' }
        ip: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        metadata:
          type: object
          description: Never contains passwords, tokens, amounts, notes or transaction details.
          additionalProperties: true
    PlatformMetrics:
      type: object
      required: [generatedAt, users, wallets, transactions, recurringTemplates]
      properties:
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
        users:
          type: object
          required: [total, active30d, new30d, suspended, admins]
          properties:
            total: { type: integer, minimum: 0 }
            active30d: { type: integer, minimum: 0, description: Signed in within 30 days. }
            new30d: { type: integer, minimum: 0 }
            suspended: { type: integer, minimum: 0 }
            admins: { type: integer, minimum: 0 }
        wallets:
          type: object
          required: [total, active]
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0, description: Not archived. }
        transactions:
          type: object
          required: [total, last30d]
          properties:
            total: { type: integer, minimum: 0 }
            last30d: { type: integer, minimum: 0, description: Created within 30 days. }
        recurringTemplates:
          type: object
          required: [active]
          properties:
            active: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, version, uptimeSeconds, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        uptimeSeconds: { type: integer, minimum: 0 }
        checks:
          type: object
          required: [database]
          properties:
            database: { type: string, enum: [up, down] }

    # ---- Pagination ----------------------------------------------------
    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { type: [string, 'null'] }
    RecurringRunPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecurringRun' }
        nextCursor: { type: [string, 'null'] }
    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEntry' }
        nextCursor: { type: [string, 'null'] }
    AdminUserPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # ---- Reports -------------------------------------------------------
    ReportSummary:
      type: object
      required: [from, to, wallets, totalsByCurrency, recentTransactions, budgets]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        wallets:
          type: array
          description: Non-archived wallets with current balance.
          items: { $ref: '#/components/schemas/Wallet' }
        totalsByCurrency:
          type: array
          items:
            type: object
            required: [currency, balanceMinor, incomeMinor, expenseMinor, netMinor]
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              balanceMinor:
                allOf:
                  - { $ref: '#/components/schemas/SignedAmountMinor' }
                description: Current balance across non-archived wallets.
              incomeMinor: { type: integer, minimum: 0 }
              expenseMinor: { type: integer, minimum: 0 }
              netMinor: { $ref: '#/components/schemas/SignedAmountMinor' }
        recentTransactions:
          type: array
          maxItems: 10
          description: Within range, ordered by date_desc.
          items: { $ref: '#/components/schemas/Transaction' }
        budgets:
          type: array
          description: Status for the period containing `to`.
          items: { $ref: '#/components/schemas/Budget' }
    ReportTrend:
      type: object
      required: [from, to, groupBy, currency, buckets]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        groupBy: { $ref: '#/components/schemas/TrendGroupBy' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        buckets:
          type: array
          description: Every bucket in range, empty buckets as zeros. Weeks start Monday.
          items:
            type: object
            required: [periodStart, periodEnd, incomeMinor, expenseMinor, netMinor]
            properties:
              periodStart: { $ref: '#/components/schemas/LocalDate' }
              periodEnd: { $ref: '#/components/schemas/LocalDate' }
              incomeMinor: { type: integer, minimum: 0 }
              expenseMinor: { type: integer, minimum: 0 }
              netMinor: { $ref: '#/components/schemas/SignedAmountMinor' }
    ReportCategoryBreakdown:
      type: object
      required: [from, to, type, currency, totalMinor, items, other]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        type: { $ref: '#/components/schemas/CategoryType' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        totalMinor: { type: integer, minimum: 0 }
        items:
          type: array
          description: Descending by amount.
          items:
            type: object
            required: [category, amountMinor, percentage, transactionCount]
            properties:
              category: { $ref: '#/components/schemas/CategoryRef' }
              amountMinor: { type: integer, minimum: 0 }
              percentage: { type: number, description: 2 decimals. }
              transactionCount: { type: integer, minimum: 0 }
        other:
          description: Percentages across items and other sum to exactly 100.00 when totalMinor is greater than 0 (largest-remainder rounding).
          oneOf:
            - type: object
              required: [amountMinor, percentage, categoryCount]
              properties:
                amountMinor: { type: integer, minimum: 0 }
                percentage: { type: number }
                categoryCount: { type: integer, minimum: 0 }
            - { type: 'null' }

    # ---- Requests (strict) --------------------------------------------
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/NewPassword' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          default: USD
        locale:
          allOf:
            - { $ref: '#/components/schemas/Locale' }
          default: en-US
        timezone:
          allOf:
            - { $ref: '#/components/schemas/TimeZone' }
          default: UTC
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    PasswordResetTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { $ref: '#/components/schemas/NewPassword' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        preferences:
          type: object
          additionalProperties: false
          properties:
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            locale: { $ref: '#/components/schemas/Locale' }
            timezone: { $ref: '#/components/schemas/TimeZone' }
            theme: { $ref: '#/components/schemas/Theme' }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:
          allOf:
            - { $ref: '#/components/schemas/NewPassword' }
          description: Must differ from the current password.
    CreateWalletRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 60,
            description: 'Unique per user, case-insensitive.',
          }
        type: { $ref: '#/components/schemas/WalletType' }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          description: Defaults to the preference currency.
        openingBalanceMinor:
          allOf:
            - { $ref: '#/components/schemas/SignedAmountMinor' }
          default: 0
    UpdateWalletRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/WalletType' }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          description: Only while the wallet has no transactions and no templates.
        openingBalanceMinor: { $ref: '#/components/schemas/SignedAmountMinor' }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, type, icon, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        type: { $ref: '#/components/schemas/CategoryType' }
        icon: { $ref: '#/components/schemas/IconKey' }
        color: { $ref: '#/components/schemas/ColorToken' }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        icon: { $ref: '#/components/schemas/IconKey' }
        color: { $ref: '#/components/schemas/ColorToken' }
    DeleteCategoryResult:
      type: object
      required: [reassignedTransactions, reassignedTemplates, deletedBudgets]
      properties:
        reassignedTransactions: { type: integer, minimum: 0 }
        reassignedTemplates: { type: integer, minimum: 0 }
        deletedBudgets: { type: integer, minimum: 0 }
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [type, walletId, categoryId, amountMinor, occurredOn]
      properties:
        type: { type: string, enum: [income, expense] }
        walletId: { $ref: '#/components/schemas/Uuid' }
        categoryId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
    UpdateTransactionRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [income, expense]
          description: If changed, `categoryId` of the matching type is required unless the current category already matches.
        walletId:
          allOf:
            - { $ref: '#/components/schemas/Uuid' }
          description: Currency follows the new wallet.
        categoryId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [fromWalletId, toWalletId, amountMinor, occurredOn]
      properties:
        fromWalletId: { $ref: '#/components/schemas/Uuid' }
        toWalletId: { $ref: '#/components/schemas/Uuid' }
        amountMinor:
          allOf:
            - { $ref: '#/components/schemas/AmountMinor' }
          description: In the fromWallet currency.
        toAmountMinor:
          allOf:
            - { $ref: '#/components/schemas/AmountMinor' }
          description: In the toWallet currency. Required if the currencies differ; if they are the same, optional and must equal amountMinor.
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
    UpdateTransferRequest:
      type: object
      additionalProperties: false
      properties:
        fromWalletId: { $ref: '#/components/schemas/Uuid' }
        toWalletId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        toAmountMinor: { $ref: '#/components/schemas/AmountMinor' }
        occurredOn: { $ref: '#/components/schemas/LocalDate' }
        note: { $ref: '#/components/schemas/Note' }
    CreateBudgetRequest:
      type: object
      additionalProperties: false
      required: [scope, amountMinor]
      properties:
        scope: { $ref: '#/components/schemas/BudgetScope' }
        categoryId:
          allOf:
            - { $ref: '#/components/schemas/Uuid' }
          description: An expense category. Required if scope is `category`; must be absent if `overall`.
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        currency:
          allOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
          description: Defaults to the preference currency.
        warningThresholdPct: { type: integer, minimum: 1, maximum: 99, default: 80 }
        startDate:
          allOf:
            - { $ref: '#/components/schemas/LocalDate' }
          description: Defaults to the start of the current period; normalized to the period start.
    UpdateBudgetRequest:
      type: object
      additionalProperties: false
      properties:
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        warningThresholdPct: { type: integer, minimum: 1, maximum: 99 }
        startDate: { $ref: '#/components/schemas/LocalDate' }
    CreateRecurringTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, type, walletId, categoryId, amountMinor, frequency, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/RecurringType' }
        walletId: { $ref: '#/components/schemas/Uuid' }
        categoryId:
          allOf:
            - { $ref: '#/components/schemas/Uuid' }
          description: The category type must match `type`.
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        note: { $ref: '#/components/schemas/Note' }
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        interval: { type: integer, minimum: 1, maximum: 99, default: 1 }
        startDate:
          allOf:
            - { $ref: '#/components/schemas/LocalDate' }
          description: On or after today minus 31 days (user timezone).
        endDate:
          description: On or after startDate.
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
    UpdateRecurringTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        walletId: { $ref: '#/components/schemas/Uuid' }
        categoryId: { $ref: '#/components/schemas/Uuid' }
        amountMinor: { $ref: '#/components/schemas/AmountMinor' }
        note: { $ref: '#/components/schemas/Note' }
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        interval: { type: integer, minimum: 1, maximum: 99 }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
    PreviewRecurringRequest:
      type: object
      additionalProperties: false
      required: [frequency, startDate]
      properties:
        frequency: { $ref: '#/components/schemas/RecurringFrequency' }
        interval: { type: integer, minimum: 1, maximum: 99, default: 1 }
        startDate: { $ref: '#/components/schemas/LocalDate' }
        endDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        fromDate:
          allOf:
            - { $ref: '#/components/schemas/LocalDate' }
          description: Returns occurrences on or after this date. Defaults to today in the user's timezone.
        count: { type: integer, minimum: 1, maximum: 24, default: 5 }
    SuspendUserRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
