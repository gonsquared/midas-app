# Local development stack with hot reload: PostgreSQL 17, Mailpit, the Midas API (tsx watch) and
# the web app (Vite dev server). It builds the `dev` stage of the Dockerfile (dev dependencies, tsx).
# The production image (`runtime` stage) is different: compiled JavaScript, and the API itself serves
# the built SPA from the same origin. This stack does not use it; see docs/operations/deployment.md.
#
#   cp .env.example .env        # then replace every change-me-* placeholder
#   docker compose up --build   # db -> migrate (one-shot) -> api + web
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and DELETE the database volume (reset)
#
#   Web app (Vite, hot module reload)  http://localhost:5173
#   API (tsx watch, restarts on edit)  http://localhost:3000
#   Mailpit UI                         http://localhost:8025
#
# Source is bind-mounted read-only over the image, so edits on the host reload the running
# services. Dependencies and lockfile changes still need `docker compose up --build`.
# Only loopback ports are published. Container networking overrides DATABASE_URL and SMTP_HOST,
# so the values in .env (written for running the API on the host) are not used by these services.
name: midas

x-midas-image: &midas-image
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
    target: dev
  image: midas-local:dev

x-midas-app: &midas-app
  <<: *midas-image
  env_file:
    - path: ./.env
      required: false
  environment: &midas-env
    NODE_ENV: development
    DATABASE_URL: 'postgres://midas_app:${MIDAS_APP_DB_PASSWORD:?set MIDAS_APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-midas}'
    DATABASE_MIGRATION_URL: 'postgres://${POSTGRES_USER:-midas_owner}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-midas}'
    # Reset links point at the SPA (Vite), which proxies /api to the API.
    APP_BASE_URL: http://localhost:5173
    MAIL_TRANSPORT: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    SMTP_SECURE: 'false'

services:
  db:
    image: postgres:17-bookworm
    # Debian-based (glibc) to match common managed PostgreSQL collations (database design notes 15.1).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midas_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-midas}
      MIDAS_APP_DB_PASSWORD: ${MIDAS_APP_DB_PASSWORD:?set MIDAS_APP_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Named volume: kept by `docker compose down`, removed by `docker compose down -v`.
      - midas-db-data:/var/lib/postgresql/data
      # Runs only when the volume is first initialized: creates the midas_app role.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    # SMTP sink for local mail (reset emails). Web UI on 8025, SMTP on 1025.
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    restart: unless-stopped

  migrate:
    <<: *midas-app
    # One-shot: applies pending migrations, then the idempotent system category seed, through the
    # owner role, then exits 0 (database design notes 11.7 and 12.1).
    command:
      - sh
      - -c
      - node --import tsx src/cli.ts migrate && node --import tsx src/cli.ts seed:system
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *midas-app
    init: true
    # Watch mode: restarts on source edits. Polling because file events from a host bind mount
    # (Docker Desktop on Windows and macOS) do not reach inotify inside the container.
    command: ['node_modules/.bin/tsx', 'watch', 'src/server.ts']
    environment:
      <<: *midas-env
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/db:/app/apps/api/db:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    # Same image (it carries the workspace dev dependencies) but no .env file or database
    # credentials: the dev server needs none of the API's secrets.
    <<: *midas-image
    init: true
    working_dir: /app/apps/web
    # Vite dev server. Binds 0.0.0.0 inside the container (published on loopback only) and proxies
    # /api and /health to the api service, so the browser stays same-origin.
    command: ['node_modules/.bin/vite', '--host', '0.0.0.0']
    environment:
      NODE_ENV: development
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_API_URL: http://api:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/public:/app/apps/web/public:ro
      - ./apps/web/index.html:/app/apps/web/index.html:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
    # Vite writes its config bundle and dependency cache under node_modules, which the image owns
    # as root. Writable scratch space for the node user (uid 1000); lost on restart, rebuilt fast.
    tmpfs:
      - /app/apps/web/node_modules/.vite-temp:uid=1000,gid=1000
      - /app/apps/web/node_modules/.vite:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  midas-db-data:
