name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: read-only token by default. Jobs that need more must say so explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same major and image family as TEST_DATABASE_IMAGE and compose.yaml (PostgreSQL 17).
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-secret # throwaway, CI-only; allowlisted in .gitleaks.toml
          POSTGRES_DB: midas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests use this admin URL instead of Testcontainers (apps/api/test/global-setup.ts).
      TEST_DATABASE_URL: postgres://postgres:ci-not-a-secret@localhost:5432/midas
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The same suites as `pnpm test`, run with V8 coverage. Thresholds are in each package's Vitest
      # config (shared: 95% lines; api and web: floors under the measured values, architecture
      # section 11); a drop below one fails this step.
      - name: Unit and integration tests with coverage thresholds
        shell: bash
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee "${RUNNER_TEMP}/test.log"
          # The database tests skip (with this marker) when no database is reachable. In CI they
          # must run, so a skip is a failure.
          if grep -q '\[db-tests\] SKIPPED' "${RUNNER_TEMP}/test.log"; then
            echo "::error::Database integration tests were skipped; TEST_DATABASE_URL is not working."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Check the web bundle has no dev-only code
        shell: bash
        run: |
          # The dev auth bypass and the design-system route must never reach a production build.
          if [ ! -d apps/web/dist ]; then
            echo '::error::apps/web/dist is missing; the web build did not run.'
            exit 1
          fi
          if grep -rIl -e 'dev-only-not-a-real-token' -e 'design-system' apps/web/dist; then
            echo '::error::Dev-only code (fake session or design-system route) found in apps/web/dist.'
            exit 1
          fi

      - name: Apply migrations and the system seed (twice, to prove idempotency) to a scratch database
        env:
          DATABASE_URL: postgres://postgres:ci-not-a-secret@localhost:5432/midas
          DATABASE_MIGRATION_URL: postgres://postgres:ci-not-a-secret@localhost:5432/midas
        run: |
          pnpm --filter @midas/api migrate
          pnpm --filter @midas/api seed:system
          pnpm --filter @midas/api seed:system

      - name: Check generated database types are up to date
        env:
          DATABASE_URL: postgres://postgres:ci-not-a-secret@localhost:5432/midas
          DATABASE_MIGRATION_URL: postgres://postgres:ci-not-a-secret@localhost:5432/midas
        run: |
          pnpm --filter @midas/api db:codegen
          if ! git diff --exit-code -- apps/api/src/platform/db/database.generated.ts; then
            echo "::error::database.generated.ts is stale. Run pnpm --filter @midas/api db:codegen against a migrated database and commit the result."
            exit 1
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks (pinned image, config in .gitleaks.toml)
        shell: bash
        run: |
          # Run as the runner's uid so git accepts the bind-mounted checkout (safe.directory).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --exit-code 1

  dependency-audit:
    name: Dependency audit (all dependencies, high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All dependencies are audited, dev tooling included (the runtime image has production ones only).
      # The one accepted advisory (braces via kysely-codegen, dev-time only) is an explicit,
      # commented ignore in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  production-image:
    name: Production image (build, smoke test, Playwright under the real CSP)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-secret # throwaway, CI-only; allowlisted in .gitleaks.toml
          POSTGRES_DB: midas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IMAGE: midas:ci
      BASE_URL: http://localhost:3000
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` puts the image in the local Docker daemon so the next steps can run it.
      - name: Build the runtime image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: midas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image contents (non-root, no secrets, no dev tooling)
        shell: bash
        run: |
          set -euo pipefail
          [ "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0" ] || { echo '::error::Image runs as root.'; exit 1; }
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for f in /app/.env /app/.env.example; do
              if [ -e "$f" ]; then echo "::error::$f is baked into the image."; exit 1; fi
            done
            if [ -e /app/node_modules/.bin/tsx ] || [ -d /app/node_modules/vitest ]; then
              echo "::error::Dev dependencies are in the runtime image."; exit 1
            fi
            test -f /app/dist/server.js && test -f /app/dist/cli.js && test -f /app/web/index.html
          '

      # NODE_ENV=development only because the CI database has no TLS (production requires
      # DATABASE_SSL=verify-full or require) and the console mailer lets the reset-password spec read
      # its link from the log. The CSP, security headers and static serving are identical in
      # production (only HSTS differs). RATE_LIMIT_REGISTER_MAX is raised because the real-API specs
      # register several accounts from one IP.
      - name: Migrate, seed and start the API from the image
        shell: bash
        run: |
          set -euo pipefail
          JWT_ACCESS_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_ACCESS_SECRET"
          COMMON=(
            --network host
            -e NODE_ENV=development
            -e DATABASE_URL=postgres://postgres:ci-not-a-secret@localhost:5432/midas
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET"
            -e APP_BASE_URL="$BASE_URL"
            -e MAIL_TRANSPORT=console
            -e RATE_LIMIT_REGISTER_MAX=1000
          )
          docker run --rm "${COMMON[@]}" "$IMAGE" sh -c 'node dist/cli.js migrate && node dist/cli.js seed:system'
          docker run -d --name midas "${COMMON[@]}" "$IMAGE"
          nohup docker logs -f midas > "${RUNNER_TEMP}/api.log" 2>&1 &

      - name: Smoke test /health, the SPA and the API 404
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL/health" > /dev/null; then break; fi
            sleep 2
          done
          health="$(curl -fsS "$BASE_URL/health")"
          echo "$health"
          grep -q '"status":"ok"' <<< "$health"
          # Browser navigation to a client route returns index.html with the CSP and no-cache.
          curl -sS -D "${RUNNER_TEMP}/spa.headers" -H 'Accept: text/html' -o "${RUNNER_TEMP}/spa.html" "$BASE_URL/wallets"
          head -1 "${RUNNER_TEMP}/spa.headers" | grep -q ' 200'
          grep -qi '^content-security-policy: .*script-src .self.' "${RUNNER_TEMP}/spa.headers"
          grep -qi '^cache-control: no-cache' "${RUNNER_TEMP}/spa.headers"
          grep -q '<div id="root">' "${RUNNER_TEMP}/spa.html"
          # An unknown API path is the JSON problem, never index.html.
          code="$(curl -sS -o "${RUNNER_TEMP}/api404.json" -w '%{http_code}' -H 'Accept: text/html' "$BASE_URL/api/v1/nope")"
          [ "$code" = 404 ]
          grep -q '"code":"NOT_FOUND"' "${RUNNER_TEMP}/api404.json"
          # The container healthcheck defined in the Dockerfile reports healthy.
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' midas)" = healthy ] && exit 0
            sleep 3
          done
          echo '::error::The container did not become healthy.'; exit 1

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @midas/e2e exec playwright install --with-deps chromium

      # The whole suite against the API-served production build. E2E_BASE_URL means no Vite server.
      # E2E_SERVED_BUILD makes every test fail on any securitypolicyviolation (the CSP header is the
      # server's own) and enables e2e/tests/csp.spec.ts. E2E_REAL_API enables the real-API specs,
      # which run against the container and PostgreSQL above.
      - name: Run Playwright
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ env.BASE_URL }}
          E2E_SERVED_BUILD: '1'
          E2E_REAL_API: '1'
        run: |
          export E2E_MAIL_LOG="${RUNNER_TEMP}/api.log"
          pnpm test:e2e

      - name: Show API logs
        if: failure()
        run: docker logs midas --tail 200 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production-image
          path: e2e/playwright-report
          retention-days: 7

  e2e:
    name: Browser tests (Playwright, fake API)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @midas/e2e exec playwright install --with-deps chromium

      # The specs mock /api/v1 in the browser (e2e/support/fake-api.ts), so no database is needed.
      # The real-API specs are opt-in (E2E_REAL_API=1) and are not run here.
      - name: Run Playwright
        env:
          CI: 'true'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
