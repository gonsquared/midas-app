packages:
  - 'apps/*'
  - 'packages/*'

# Dependency audit policy (CI runs `pnpm audit --audit-level=high` over ALL dependencies, because
# the runtime image ships devDependencies and runs the API through tsx).
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS (CVE-2026-93687). Reached only through
    # apps/api > kysely-codegen > micromatch > braces, a dev-time code generator that never
    # handles untrusted input and is not imported by the server. No patched version exists.
    # Re-evaluate when kysely-codegen or micromatch drops braces.
    - GHSA-vfj7-8cjw-p6xm
